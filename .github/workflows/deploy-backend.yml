name: Deploy backend

on:
  push:
    branches:
      - main
    paths:
      - "ineeddownpipe-back/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE }}
  ECS_CONTAINER_NAME: ${{ vars.ECS_CONTAINER_NAME }}
  ECS_DESIRED_COUNT: ${{ vars.ECS_DESIRED_COUNT }}

jobs:
  deploy:
    name: Build image and update ECS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ineeddownpipe-back

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GH_SUBMODULE_TOKEN || github.token }}

      - name: Validate required configuration
        run: |
          if [ -z "$AWS_ROLE_ARN" ] && { [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; }; then
            echo "Missing AWS credentials."
            echo "Set either GitHub variable AWS_ROLE_ARN (same as OrigemLab), or secrets AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY."
            echo "If you are using temporary AWS credentials, also set AWS_SESSION_TOKEN."
            exit 1
          fi
          test -n "$AWS_REGION" || (echo "Missing repository variable AWS_REGION" && exit 1)
          test -n "$ECR_REPOSITORY" || (echo "Missing repository variable ECR_REPOSITORY" && exit 1)
          test -n "$ECS_CLUSTER" || (echo "Missing repository variable ECS_CLUSTER" && exit 1)
          test -n "$ECS_SERVICE" || (echo "Missing repository variable ECS_SERVICE" && exit 1)
          test -n "$ECS_CONTAINER_NAME" || (echo "Missing repository variable ECS_CONTAINER_NAME" && exit 1)

      - name: Configure AWS credentials with OIDC role
        if: ${{ env.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials with access keys
        if: ${{ env.AWS_ROLE_ARN == '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Fetch current ECS task definition
        run: |
          SERVICE_JSON="$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --output json)"

          echo "$SERVICE_JSON" > service.json

          FAILURE_REASON="$(jq -r '.failures[0].reason // empty' service.json)"
          if [ -n "$FAILURE_REASON" ]; then
            echo "::error::ECS service lookup failed for service '$ECS_SERVICE' in cluster '$ECS_CLUSTER' (region '$AWS_REGION'): $FAILURE_REASON"
            echo "Existing services in cluster '$ECS_CLUSTER':"
            aws ecs list-services \
              --cluster "$ECS_CLUSTER" \
              --query 'serviceArns[]' \
              --output text || true
            exit 1
          fi

          TASK_DEFINITION_ARN="$(jq -r '.services[0].taskDefinition // empty' service.json)"

          if [ -z "$TASK_DEFINITION_ARN" ] || [ "$TASK_DEFINITION_ARN" = "None" ]; then
            echo "::error::Could not find task definition for ECS service '$ECS_SERVICE' in cluster '$ECS_CLUSTER'."
            echo "Service details:"
            jq '.services[0] // {}' service.json
            exit 1
          fi

          aws ecs describe-task-definition \
            --task-definition "$TASK_DEFINITION_ARN" \
            --query taskDefinition \
            > task-definition.json

      - name: Render new task definition
        env:
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
        run: |
          jq \
            --arg IMAGE_URI "$IMAGE_URI" \
            --arg CONTAINER_NAME "$ECS_CONTAINER_NAME" \
            'del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )
            | .containerDefinitions = (
              .containerDefinitions
              | map(if .name == $CONTAINER_NAME then .image = $IMAGE_URI else . end)
            )' \
            task-definition.json > task-definition-rendered.json

          UPDATED_COUNT="$(jq --arg CONTAINER_NAME "$ECS_CONTAINER_NAME" '[.containerDefinitions[] | select(.name == $CONTAINER_NAME)] | length' task-definition-rendered.json)"
          test "$UPDATED_COUNT" = "1" || {
            echo "Container $ECS_CONTAINER_NAME not found in task definition"
            exit 1
          }

      - name: Register task definition and update service
        run: |
          NEW_TASK_DEFINITION_ARN="$(aws ecs register-task-definition \
            --cli-input-json file://task-definition-rendered.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$NEW_TASK_DEFINITION_ARN" \
            --desired-count "${ECS_DESIRED_COUNT:-1}" \
            --force-new-deployment

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].{status:status,desiredCount:desiredCount,runningCount:runningCount,pendingCount:pendingCount,taskDefinition:taskDefinition}' \
            --output table
