name: Deploy backend

on:
  push:
    branches:
      - main
    paths:
      - "ineeddownpipe-back/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE }}
  ECS_CONTAINER_NAME: ${{ vars.ECS_CONTAINER_NAME }}
  ECS_CONTAINER_PORT: ${{ vars.ECS_CONTAINER_PORT }}
  ECS_DESIRED_COUNT: ${{ vars.ECS_DESIRED_COUNT }}
  ECS_ALB_NAME: ${{ vars.ECS_ALB_NAME }}
  ECS_TARGET_GROUP_NAME: ${{ vars.ECS_TARGET_GROUP_NAME }}
  ECS_ALB_SUBNET_IDS: ${{ vars.ECS_ALB_SUBNET_IDS }}
  ECS_ALB_SECURITY_GROUP_ID: ${{ vars.ECS_ALB_SECURITY_GROUP_ID }}
  ECS_VPC_ID: ${{ vars.ECS_VPC_ID }}
  BACKEND_SUBMODULE_REF: ${{ vars.BACKEND_SUBMODULE_REF }}

jobs:
  deploy:
    name: Build image and update ECS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ineeddownpipe-back

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GH_SUBMODULE_TOKEN || github.token }}

      - name: Use latest backend submodule ref
        id: backend_ref
        working-directory: .
        run: |
          REF="${BACKEND_SUBMODULE_REF:-main}"
          git -C ineeddownpipe-back fetch origin "$REF" --depth=1
          git -C ineeddownpipe-back checkout "origin/$REF"
          BACKEND_SHA="$(git -C ineeddownpipe-back rev-parse HEAD)"
          echo "backend_sha=$BACKEND_SHA" >> "$GITHUB_OUTPUT"
          echo "Deploying backend submodule ref: $REF"
          echo "Deploying backend commit: $BACKEND_SHA"

      - name: Validate required configuration
        run: |
          if [ -z "$AWS_ROLE_ARN" ] && { [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; }; then
            echo "Missing AWS credentials."
            echo "Set either GitHub variable AWS_ROLE_ARN (same as OrigemLab), or secrets AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY."
            echo "If you are using temporary AWS credentials, also set AWS_SESSION_TOKEN."
            exit 1
          fi
          test -n "$AWS_REGION" || (echo "Missing repository variable AWS_REGION" && exit 1)
          test -n "$ECR_REPOSITORY" || (echo "Missing repository variable ECR_REPOSITORY" && exit 1)
          test -n "$ECS_CLUSTER" || (echo "Missing repository variable ECS_CLUSTER" && exit 1)
          test -n "$ECS_SERVICE" || (echo "Missing repository variable ECS_SERVICE" && exit 1)

      - name: Configure AWS credentials with OIDC role
        if: ${{ env.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials with access keys
        if: ${{ env.AWS_ROLE_ARN == '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.backend_ref.outputs.backend_sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"
          echo "EXPECTED_IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Fetch current ECS task definition
        run: |
          SERVICE_JSON="$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --output json)"

          echo "$SERVICE_JSON" > service.json

          FAILURE_REASON="$(jq -r '.failures[0].reason // empty' service.json)"
          if [ -n "$FAILURE_REASON" ]; then
            echo "::error::ECS service lookup failed for service '$ECS_SERVICE' in cluster '$ECS_CLUSTER' (region '$AWS_REGION'): $FAILURE_REASON"
            echo "Existing services in cluster '$ECS_CLUSTER':"
            aws ecs list-services \
              --cluster "$ECS_CLUSTER" \
              --query 'serviceArns[]' \
              --output text || true
            exit 1
          fi

          TASK_DEFINITION_ARN="$(jq -r '.services[0].taskDefinition // empty' service.json)"

          if [ -z "$TASK_DEFINITION_ARN" ] || [ "$TASK_DEFINITION_ARN" = "None" ]; then
            echo "::error::Could not find task definition for ECS service '$ECS_SERVICE' in cluster '$ECS_CLUSTER'."
            echo "Service details:"
            jq '.services[0] // {}' service.json
            exit 1
          fi

          aws ecs describe-task-definition \
            --task-definition "$TASK_DEFINITION_ARN" \
            --query taskDefinition \
            > task-definition.json

      - name: Render new task definition
        env:
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
        run: |
          CONTAINER_PORT="${ECS_CONTAINER_PORT:-3001}"
          if ! [[ "$CONTAINER_PORT" =~ ^[0-9]+$ ]]; then
            echo "::error::ECS_CONTAINER_PORT must be a number, got '$CONTAINER_PORT'."
            exit 1
          fi
          echo "ECS_CONTAINER_PORT=$CONTAINER_PORT" >> "$GITHUB_ENV"

          CONTAINER_NAME="$ECS_CONTAINER_NAME"
          if [[ "$CONTAINER_NAME" == arn:* || "$CONTAINER_NAME" == *"/"* ]]; then
            echo "::warning::ECS_CONTAINER_NAME looks like an ARN/path, not a container name. Ignoring it and auto-detecting."
            CONTAINER_NAME=""
          fi
          if [ -z "$CONTAINER_NAME" ]; then
            CONTAINER_COUNT="$(jq '.containerDefinitions | length' task-definition.json)"
            if [ "$CONTAINER_COUNT" != "1" ]; then
              echo "::error::ECS_CONTAINER_NAME is required because task definition has $CONTAINER_COUNT containers."
              jq -r '.containerDefinitions[].name' task-definition.json
              exit 1
            fi
            CONTAINER_NAME="$(jq -r '.containerDefinitions[0].name' task-definition.json)"
            echo "Auto-detected ECS container name: $CONTAINER_NAME"
          fi
          echo "RESOLVED_ECS_CONTAINER_NAME=$CONTAINER_NAME" >> "$GITHUB_ENV"

          jq \
            --arg IMAGE_URI "$IMAGE_URI" \
            --arg CONTAINER_NAME "$CONTAINER_NAME" \
            --argjson CONTAINER_PORT "$CONTAINER_PORT" \
            'del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )
            | .containerDefinitions = (
              .containerDefinitions
              | map(
                  if .name == $CONTAINER_NAME then
                    .image = $IMAGE_URI
                    | .portMappings = (
                        (.portMappings // [] | map(select(.containerPort != $CONTAINER_PORT)))
                        + [{containerPort: $CONTAINER_PORT, hostPort: $CONTAINER_PORT, protocol: "tcp"}]
                      )
                    | .environment = (
                        (.environment // [] | map(select(.name != "PORT")))
                        + [{name: "PORT", value: ($CONTAINER_PORT | tostring)}]
                      )
                  else
                    .
                  end
                )
            )' \
            task-definition.json > task-definition-rendered.json

          UPDATED_COUNT="$(jq --arg CONTAINER_NAME "$CONTAINER_NAME" '[.containerDefinitions[] | select(.name == $CONTAINER_NAME)] | length' task-definition-rendered.json)"
          test "$UPDATED_COUNT" = "1" || {
            echo "::error::Container '$CONTAINER_NAME' not found in task definition."
            echo "Available containers:"
            jq -r '.containerDefinitions[].name' task-definition.json
            exit 1
          }

          echo "Rendered container port mapping:"
          jq --arg CONTAINER_NAME "$CONTAINER_NAME" '.containerDefinitions[] | select(.name == $CONTAINER_NAME) | {name, portMappings, environment: (.environment // [] | map(select(.name == "PORT")))}' task-definition-rendered.json

      - name: Ensure public ALB for ECS service
        run: |
          CONTAINER_PORT="${ECS_CONTAINER_PORT:-3001}"
          echo "ECS_CONTAINER_PORT=$CONTAINER_PORT" >> "$GITHUB_ENV"

          SERVICE_SUBNETS="$(jq -r '.services[0].networkConfiguration.awsvpcConfiguration.subnets // [] | join(" ")' service.json)"
          SERVICE_SECURITY_GROUPS="$(jq -r '.services[0].networkConfiguration.awsvpcConfiguration.securityGroups // [] | join(" ")' service.json)"

          SUBNET_IDS="${ECS_ALB_SUBNET_IDS:-$SERVICE_SUBNETS}"
          if [ -z "$SUBNET_IDS" ]; then
            echo "::error::Could not infer ECS service subnets. Set GitHub variable ECS_ALB_SUBNET_IDS with public subnet IDs separated by spaces."
            exit 1
          fi

          FIRST_SUBNET="$(echo "$SUBNET_IDS" | awk '{print $1}')"
          VPC_ID="${ECS_VPC_ID:-$(aws ec2 describe-subnets --subnet-ids "$FIRST_SUBNET" --query 'Subnets[0].VpcId' --output text)}"
          if [ -z "$VPC_ID" ] || [ "$VPC_ID" = "None" ]; then
            echo "::error::Could not determine VPC ID. Set GitHub variable ECS_VPC_ID."
            exit 1
          fi

          SERVICE_SECURITY_GROUP="$(echo "$SERVICE_SECURITY_GROUPS" | awk '{print $1}')"
          if [ -z "$SERVICE_SECURITY_GROUP" ]; then
            echo "::warning::Could not infer ECS service security group. The ALB may be unable to reach the task unless ingress is already configured."
          fi

          ALB_NAME="$(echo "${ECS_ALB_NAME:-$ECS_SERVICE-alb}" | tr -cd '[:alnum:]-' | cut -c1-32)"
          TARGET_GROUP_NAME="$(echo "${ECS_TARGET_GROUP_NAME:-$ECS_SERVICE-tg}" | tr -cd '[:alnum:]-' | cut -c1-32)"
          ALB_SECURITY_GROUP_ID="$ECS_ALB_SECURITY_GROUP_ID"

          if [ -z "$ALB_SECURITY_GROUP_ID" ]; then
            ALB_SECURITY_GROUP_NAME="$ALB_NAME-sg"
            ALB_SECURITY_GROUP_ID="$(aws ec2 describe-security-groups \
              --filters "Name=vpc-id,Values=$VPC_ID" "Name=group-name,Values=$ALB_SECURITY_GROUP_NAME" \
              --query 'SecurityGroups[0].GroupId' \
              --output text 2>/dev/null || true)"

            if [ -z "$ALB_SECURITY_GROUP_ID" ] || [ "$ALB_SECURITY_GROUP_ID" = "None" ]; then
              ALB_SECURITY_GROUP_ID="$(aws ec2 create-security-group \
                --group-name "$ALB_SECURITY_GROUP_NAME" \
                --description "Public ALB for $ECS_SERVICE" \
                --vpc-id "$VPC_ID" \
                --query 'GroupId' \
                --output text)"
            fi

            aws ec2 authorize-security-group-ingress \
              --group-id "$ALB_SECURITY_GROUP_ID" \
              --ip-permissions 'IpProtocol=tcp,FromPort=80,ToPort=80,IpRanges=[{CidrIp=0.0.0.0/0,Description="HTTP from internet"}]' \
              >/dev/null 2>&1 || true
          fi

          if [ -n "$SERVICE_SECURITY_GROUP" ]; then
            aws ec2 authorize-security-group-ingress \
              --group-id "$SERVICE_SECURITY_GROUP" \
              --ip-permissions "IpProtocol=tcp,FromPort=$CONTAINER_PORT,ToPort=$CONTAINER_PORT,UserIdGroupPairs=[{GroupId=$ALB_SECURITY_GROUP_ID,Description=\"ALB to ECS task\"}]" \
              >/dev/null 2>&1 || true
          fi

          ALB_ARN="$(aws elbv2 describe-load-balancers \
            --names "$ALB_NAME" \
            --query 'LoadBalancers[0].LoadBalancerArn' \
            --output text 2>/dev/null || true)"

          if [ -z "$ALB_ARN" ] || [ "$ALB_ARN" = "None" ]; then
            ALB_ARN="$(aws elbv2 create-load-balancer \
              --name "$ALB_NAME" \
              --type application \
              --scheme internet-facing \
              --security-groups "$ALB_SECURITY_GROUP_ID" \
              --subnets $SUBNET_IDS \
              --query 'LoadBalancers[0].LoadBalancerArn' \
              --output text)"
          fi

          aws elbv2 wait load-balancer-available --load-balancer-arns "$ALB_ARN"

          ALB_DNS="$(aws elbv2 describe-load-balancers \
            --load-balancer-arns "$ALB_ARN" \
            --query 'LoadBalancers[0].DNSName' \
            --output text)"

          TARGET_GROUP_ARN="$(aws elbv2 describe-target-groups \
            --names "$TARGET_GROUP_NAME" \
            --query 'TargetGroups[0].TargetGroupArn' \
            --output text 2>/dev/null || true)"

          if [ -n "$TARGET_GROUP_ARN" ] && [ "$TARGET_GROUP_ARN" != "None" ]; then
            TARGET_TYPE="$(aws elbv2 describe-target-groups \
              --target-group-arns "$TARGET_GROUP_ARN" \
              --query 'TargetGroups[0].TargetType' \
              --output text)"
            if [ "$TARGET_TYPE" != "ip" ]; then
              echo "::warning::Target group '$TARGET_GROUP_NAME' has target type '$TARGET_TYPE'. ECS awsvpc/Fargate requires target type 'ip'. Creating a dedicated ECS target group instead."
              TARGET_GROUP_NAME="$(echo "${ECS_SERVICE}-ip-tg" | tr -cd '[:alnum:]-' | cut -c1-32)"
              TARGET_GROUP_ARN="$(aws elbv2 describe-target-groups \
                --names "$TARGET_GROUP_NAME" \
                --query 'TargetGroups[0].TargetGroupArn' \
                --output text 2>/dev/null || true)"
            fi
          fi

          if [ -z "$TARGET_GROUP_ARN" ] || [ "$TARGET_GROUP_ARN" = "None" ]; then
            TARGET_GROUP_ARN="$(aws elbv2 create-target-group \
              --name "$TARGET_GROUP_NAME" \
              --protocol HTTP \
              --port "$CONTAINER_PORT" \
              --vpc-id "$VPC_ID" \
              --target-type ip \
              --health-check-protocol HTTP \
              --health-check-path /api/health \
              --matcher HttpCode=200-399 \
              --query 'TargetGroups[0].TargetGroupArn' \
              --output text)"
          fi

          TARGET_TYPE="$(aws elbv2 describe-target-groups \
            --target-group-arns "$TARGET_GROUP_ARN" \
            --query 'TargetGroups[0].TargetType' \
            --output text)"
          if [ "$TARGET_TYPE" != "ip" ]; then
            echo "::error::Target group '$TARGET_GROUP_NAME' is still target type '$TARGET_TYPE'. ECS awsvpc/Fargate requires target type 'ip'. Clear ECS_TARGET_GROUP_NAME or set it to a target group with target type ip."
            exit 1
          fi

          LISTENER_ARN="$(aws elbv2 describe-listeners \
            --load-balancer-arn "$ALB_ARN" \
            --query 'Listeners[?Port==`80`].ListenerArn | [0]' \
            --output text 2>/dev/null || true)"

          if [ -z "$LISTENER_ARN" ] || [ "$LISTENER_ARN" = "None" ]; then
            aws elbv2 create-listener \
              --load-balancer-arn "$ALB_ARN" \
              --protocol HTTP \
              --port 80 \
              --default-actions Type=forward,TargetGroupArn="$TARGET_GROUP_ARN" \
              >/dev/null
          else
            aws elbv2 modify-listener \
              --listener-arn "$LISTENER_ARN" \
              --default-actions Type=forward,TargetGroupArn="$TARGET_GROUP_ARN" \
              >/dev/null
          fi

          echo "ECS_TARGET_GROUP_ARN=$TARGET_GROUP_ARN" >> "$GITHUB_ENV"
          echo "BACKEND_PUBLIC_URL=http://$ALB_DNS" >> "$GITHUB_ENV"
          {
            echo "### Backend URL"
            echo ""
            echo "Set frontend GitHub variable \`VITE_API_URL\` to:"
            echo ""
            echo "\`http://$ALB_DNS\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Register task definition and update service
        run: |
          NEW_TASK_DEFINITION_ARN="$(aws ecs register-task-definition \
            --cli-input-json file://task-definition-rendered.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$NEW_TASK_DEFINITION_ARN" \
            --load-balancers "targetGroupArn=$ECS_TARGET_GROUP_ARN,containerName=$RESOLVED_ECS_CONTAINER_NAME,containerPort=$ECS_CONTAINER_PORT" \
            --desired-count "${ECS_DESIRED_COUNT:-1}" \
            --force-new-deployment

          if ! aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"; then
            echo "::error::ECS service did not become stable before the waiter timed out."

            echo "Service summary:"
            aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_SERVICE" \
              --query 'services[0].{status:status,desiredCount:desiredCount,runningCount:runningCount,pendingCount:pendingCount,deployments:deployments[].{status:status,rolloutState:rolloutState,rolloutStateReason:rolloutStateReason,desiredCount:desiredCount,runningCount:runningCount,pendingCount:pendingCount,failedTasks:failedTasks,taskDefinition:taskDefinition}}' \
              --output json || true

            echo "Recent ECS service events:"
            aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_SERVICE" \
              --query 'services[0].events[0:15].[createdAt,message]' \
              --output table || true

            echo "Target group health:"
            aws elbv2 describe-target-health \
              --target-group-arn "$ECS_TARGET_GROUP_ARN" \
              --query 'TargetHealthDescriptions[].{target:Target.Id,port:Target.Port,state:TargetHealth.State,reason:TargetHealth.Reason,description:TargetHealth.Description}' \
              --output table || true

            TASK_ARNS="$(aws ecs list-tasks \
              --cluster "$ECS_CLUSTER" \
              --service-name "$ECS_SERVICE" \
              --desired-status STOPPED \
              --query 'taskArns[0:10]' \
              --output text || true)"

            if [ -n "$TASK_ARNS" ] && [ "$TASK_ARNS" != "None" ]; then
              echo "Recent stopped tasks:"
              aws ecs describe-tasks \
                --cluster "$ECS_CLUSTER" \
                --tasks $TASK_ARNS \
                --query 'tasks[].{taskArn:taskArn,stoppedReason:stoppedReason,stopCode:stopCode,lastStatus:lastStatus,containers:containers[].{name:name,exitCode:exitCode,reason:reason,lastStatus:lastStatus,image:image}}' \
                --output json || true
            fi

            echo "Likely causes: container crash, health check failing at /api/health, ECS task security group not allowing ALB on port $ECS_CONTAINER_PORT, wrong public subnets, or task cannot pull/start image."
            exit 1
          fi

          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].{status:status,desiredCount:desiredCount,runningCount:runningCount,pendingCount:pendingCount,taskDefinition:taskDefinition}' \
            --output table

          ACTIVE_TASK_DEFINITION_ARN="$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)"

          aws ecs describe-task-definition \
            --task-definition "$ACTIVE_TASK_DEFINITION_ARN" \
            --query taskDefinition \
            > active-task-definition.json

          ACTIVE_IMAGE_URI="$(jq -r --arg CONTAINER_NAME "$RESOLVED_ECS_CONTAINER_NAME" '.containerDefinitions[] | select(.name == $CONTAINER_NAME) | .image' active-task-definition.json)"

          echo "Expected image: $EXPECTED_IMAGE_URI"
          echo "Active task definition: $ACTIVE_TASK_DEFINITION_ARN"
          echo "Active image: $ACTIVE_IMAGE_URI"

          if [ "$ACTIVE_IMAGE_URI" != "$EXPECTED_IMAGE_URI" ]; then
            echo "::error::ECS service '$ECS_SERVICE' is not using the image pushed by this workflow."
            echo "Container: $RESOLVED_ECS_CONTAINER_NAME"
            echo "Expected:  $EXPECTED_IMAGE_URI"
            echo "Actual:    $ACTIVE_IMAGE_URI"
            echo "Available containers in active task definition:"
            jq -r '.containerDefinitions[] | "\(.name) -> \(.image)"' active-task-definition.json
            exit 1
          fi

          RUNNING_TASK_ARNS="$(aws ecs list-tasks \
            --cluster "$ECS_CLUSTER" \
            --service-name "$ECS_SERVICE" \
            --desired-status RUNNING \
            --query 'taskArns' \
            --output text)"

          if [ -z "$RUNNING_TASK_ARNS" ] || [ "$RUNNING_TASK_ARNS" = "None" ]; then
            echo "::error::No running ECS tasks found for service '$ECS_SERVICE' after deployment."
            exit 1
          fi

          aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks $RUNNING_TASK_ARNS \
            --query 'tasks[].{taskArn:taskArn,lastStatus:lastStatus,taskDefinitionArn:taskDefinitionArn,containers:containers[].{name:name,image:image,lastStatus:lastStatus}}' \
            --output json \
            > running-tasks.json

          echo "Running task images:"
          jq -r '.[] | .taskArn as $task | .containers[] | "\($task) :: \(.name) :: \(.image) :: \(.lastStatus)"' running-tasks.json

          MATCHING_RUNNING_COUNT="$(jq --arg CONTAINER_NAME "$RESOLVED_ECS_CONTAINER_NAME" --arg IMAGE_URI "$EXPECTED_IMAGE_URI" '[.[] | .containers[] | select(.name == $CONTAINER_NAME and .image == $IMAGE_URI)] | length' running-tasks.json)"
          if [ "$MATCHING_RUNNING_COUNT" = "0" ]; then
            echo "::error::No running ECS task is using expected image '$EXPECTED_IMAGE_URI' for container '$RESOLVED_ECS_CONTAINER_NAME'."
            exit 1
          fi
