name: Deploy frontend
# Triggers on submodule gitlink updates (ineeddownpipe-front) and file changes under ineeddownpipe-front/

on:
  push:
    branches:
      - main
    paths:
      # Submodule updates only change the gitlink path (not files under **/)
      - "ineeddownpipe-front"
      - "ineeddownpipe-front/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  FRONTEND_S3_BUCKET: ${{ vars.FRONTEND_S3_BUCKET }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
  VITE_API_URL: ${{ vars.VITE_API_URL }}
  VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
  VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
  FRONTEND_SUBMODULE_REF: ${{ vars.FRONTEND_SUBMODULE_REF }}

jobs:
  deploy:
    name: Build static site and sync S3
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ineeddownpipe-front

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GH_SUBMODULE_TOKEN || github.token }}

      - name: Use frontend submodule ref
        id: frontend_ref
        working-directory: .
        run: |
          REF="${FRONTEND_SUBMODULE_REF:-main}"
          test -f ineeddownpipe-front/package.json || {
            echo "ineeddownpipe-front submodule was not checked out."
            echo "Set GitHub secret GH_SUBMODULE_TOKEN with read access to caiobraga/ineeddownpipe-front"
            exit 1
          }
          git -C ineeddownpipe-front fetch origin "$REF" --depth=1
          git -C ineeddownpipe-front checkout "origin/$REF"
          FRONT_SHA="$(git -C ineeddownpipe-front rev-parse HEAD)"
          echo "front_sha=$FRONT_SHA" >> "$GITHUB_OUTPUT"
          echo "Deploying frontend submodule ref: $REF"
          echo "Deploying frontend commit: $FRONT_SHA"

      - name: Validate required configuration
        run: |
          if [ -z "$AWS_ROLE_ARN" ] && { [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; }; then
            echo "Missing AWS credentials."
            echo "Set either GitHub variable AWS_ROLE_ARN (same as OrigemLab), or secrets AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY."
            echo "If you are using temporary AWS credentials, also set AWS_SESSION_TOKEN."
            exit 1
          fi
          test -n "$AWS_REGION" || (echo "Missing repository variable AWS_REGION" && exit 1)
          test -n "$FRONTEND_S3_BUCKET" || (echo "Missing repository variable FRONTEND_S3_BUCKET" && exit 1)
          test -n "$CLOUDFRONT_DISTRIBUTION_ID" || (echo "Missing repository variable CLOUDFRONT_DISTRIBUTION_ID" && exit 1)
          test -n "$VITE_API_URL" || (echo "Missing repository variable VITE_API_URL" && exit 1)
          test -n "$VITE_SITE_URL" || (echo "Missing repository variable VITE_SITE_URL" && exit 1)
          case "$VITE_API_URL" in
            http://*|https://*) ;;
            *)
              echo "Repository variable VITE_API_URL must include http:// or https://."
              echo "Example: http://ineeddownpipe-backend-414104992.us-east-1.elb.amazonaws.com"
              exit 1
              ;;
          esac
          test -n "$VITE_SUPABASE_URL" || (echo "Missing repository variable SUPABASE_URL (used for VITE_SUPABASE_URL at build time)" && exit 1)
          test -n "$VITE_SUPABASE_ANON_KEY" || (echo "Missing repository variable VITE_SUPABASE_ANON_KEY" && exit 1)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ineeddownpipe-front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_API_URL: ${{ env.VITE_API_URL }}
          VITE_SITE_URL: ${{ env.VITE_SITE_URL }}
          VITE_SUPABASE_URL: ${{ env.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ env.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Configure AWS credentials with OIDC role
        if: ${{ env.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials with access keys
        if: ${{ env.AWS_ROLE_ARN == '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync dist to S3
        run: |
          aws s3 sync dist/ "s3://$FRONTEND_S3_BUCKET" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html" \
            --exclude "robots.txt" \
            --exclude "sitemap.xml"

          aws s3 cp dist/index.html "s3://$FRONTEND_S3_BUCKET/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html"

          aws s3 cp dist/robots.txt "s3://$FRONTEND_S3_BUCKET/robots.txt" \
            --cache-control "public,max-age=300" \
            --content-type "text/plain" || true

          aws s3 cp dist/sitemap.xml "s3://$FRONTEND_S3_BUCKET/sitemap.xml" \
            --cache-control "public,max-age=300" \
            --content-type "application/xml" || true

      - name: Invalidate CloudFront
        id: invalidation
        run: |
          OUT="$(aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*")"
          echo "$OUT"
          INVALIDATION_ID="$(echo "$OUT" | python3 -c "import sys,json; print(json.load(sys.stdin)['Invalidation']['Id'])")"
          echo "invalidation_id=$INVALIDATION_ID" >> "$GITHUB_OUTPUT"
          echo "Deployed frontend commit ${{ steps.frontend_ref.outputs.front_sha }} to s3://$FRONTEND_S3_BUCKET"
          echo "CloudFront invalidation: $INVALIDATION_ID"
